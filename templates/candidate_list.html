{% extends 'base.html' %}
{% block content %}
<section class="card">
    <h2>Candidate List</h2>
    <form class="toolbar" method="get">
        <input type="text" name="search" value="{{ search }}" placeholder="Search name, email, skills">
        <button class="btn btn-primary" type="submit">Search</button>
    </form>
    <table>
        <thead><tr><th>Name</th><th>Email</th><th>Skills</th><th>Experience</th><th>Actions</th></tr></thead>
        <tbody>
            {% for candidate in candidates %}
            <tr>
                <td>{{ candidate.full_name }}</td>
                <td>{{ candidate.email }}</td>
                <td>{{ candidate.skills }}</td>
                <td>{{ candidate.experience }}</td>
                <td><a href="{{ url_for('edit_candidate', candidate_id=candidate.id) }}">Edit</a></td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</section>
{% endblock %}

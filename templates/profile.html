{% extends 'base.html' %}
{% block content %}
<section class="auth-shell">
    <div class="auth-card">
        <div class="auth-header">
            <p class="eyebrow">Profile settings</p>
            <h2>Profile</h2>
            <p>Keep your professional details accurate and up to date.</p>
        </div>

        <form class="auth-form" method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

            <div class="form-grid">
                <div class="form-group">
                    <label for="full_name">Full Name</label>
                    <input id="full_name" type="text" name="full_name" value="{{ candidate.full_name }}" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input id="email" type="email" name="email" value="{{ candidate.email }}" required>
                </div>
                <div class="form-group">
                    <label for="phone">Phone</label>
                    <input id="phone" type="text" name="phone" value="{{ candidate.phone }}" required>
                </div>
                <div class="form-group">
                    <label for="skills">Skills</label>
                    <input id="skills" type="text" name="skills" value="{{ candidate.skills }}" required>
                </div>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label for="education">Education</label>
                    <input id="education" type="text" name="education" value="{{ candidate.education }}" required>
                </div>
                <div class="form-group">
                    <label for="experience">Experience</label>
                    <input id="experience" type="text" name="experience" value="{{ candidate.experience }}" required>
                </div>
            </div>

            <button class="btn btn-primary" type="submit">Update</button>
        </form>
    </div>
</section>
{% endblock %}

{% extends 'base.html' %}
{% block content %}
<section class="auth-shell">
    <div class="auth-card">
        <div class="auth-header">
            <p class="eyebrow">Admin panel</p>
            <h2>Create HR User</h2>
            <p>Grant HR access by creating a new account below.</p>
        </div>

        <form class="auth-form" method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

            <div class="form-group">
                <label for="username">Username</label>
                <input id="username" type="text" name="username" placeholder="e.g. hrmanager" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input id="email" type="email" name="email" placeholder="hr@company.com" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input id="password" type="password" name="password" placeholder="Create a secure password" required>
            </div>

            <button class="btn btn-primary" type="submit">Create</button>
        </form>
    </div>
</section>

<section class="card">
    <h3>Existing HR Users</h3>
    <ul class="stack-list">
        {% for user in users %}
        <li class="list-item">{{ user.username }} — {{ user.email }}</li>
        {% endfor %}
    </ul>
</section>
{% endblock %}
